# Runs the smog forecast every hour on GitHub (cloud), even when the laptop is off.
# It saves prediction_log.csv, latest_risk.json, verify_summary.txt and current_conditions.json back into this repository.
name: Hourly smog forecast

on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7 (GitHub may start a few minutes late)
  workflow_dispatch:        # adds a "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: hourly-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Karachi                          # use Pakistan time, same as the laptop
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}   # hidden key, set in GitHub Settings > Secrets
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run forecast and verify
        run: python run_forecast.py

      - name: Get current weather and air quality
        run: python current_conditions.py

      - name: Save results to the repository
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add prediction_log.csv latest_risk.json verify_summary.txt current_conditions.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Hourly forecast $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
